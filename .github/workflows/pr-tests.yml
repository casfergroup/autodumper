name: PR Tests
permissions:
  contents: read

on:
  pull_request:
    branches:
      - main

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image and export locally (for SAST scan)
        uses: docker/build-push-action@v6
        with:
          context: ./build
          tags: casfergroup/autodumper:test
          load: true 
          platforms: linux/amd64

      - name: Save image to tar file
        run: docker save casfergroup/autodumper:test -o autodumper.tar

      - name: Upload image as artifact
        uses: actions/upload-artifact@v4
        with:
          name: autodumper-image
          path: autodumper.tar

  sast:
    runs-on: ubuntu-latest
    needs: docker-build

    steps:
      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: autodumper-image

      - name: Load Docker image
        run: docker load -i autodumper.tar

      - name: Run Trivy (fail on CRITICAL and HIGH)
        uses: aquasecurity/trivy-action@0.30.0
        with:
              image-ref: 'casfergroup/autodumper:test'
              format: 'table'
              severity: 'CRITICAL,HIGH'
              exit-code: '1'
